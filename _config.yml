title: Nadir Fasola
logoWebp: /assets/img/logo/Nadir.webp
logoJpg: /assets/img/logo/Nadir.jpg
logoName: Nadir
logoSurname: Fasola
email: nfasola@sissa.it
description: My personal website
baseurl: ""
url: "https://nadirfasola.github.io"
show_downloads: false
google_analytics: G-W9PTS9XZ2E
color-scheme: auto
plugins:
  - jemoji
  - jekyll-contentful-data-import
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  courses:
    output: true

markdown: kramdown
kramdown:
  input: GFM # This enables GitHub Flavored Markdown (optional, but good practice)
  hard_wrap: false # Prevents Jekyll from adding <br> tags unintentionally
  math_engine: mathjax # <--- THIS IS CRITICAL! Tells Kramdown to leave math for MathJax.
  syntax_highlighter: rouge # Ensure this is set to your highlighter (Jekyll's default is Rouge)

# Contenful integration
contentful:
  spaces:
    - NadirFasola:
        space: ENV_CONTENTFUL_SPACE_ID
        access_token: ENV_CONTENTFUL_ACCESS_TOKEN
        cda_query:
          limit: 1000

# Social icons
sidebar:
  - name: Google Scholar
    icon: <i class="ai ai-google-scholar"></i>
    link: https://scholar.google.com/citations?user=32eauoIAAAAJ
  - name: ArXiv
    icon: <i class="ai ai-arxiv"></i>
    link: https://arxiv.org/search/math?searchtype=author&query=Fasola%2C+N
  - name: Researchgate
    icon: <i class="ai ai-researchgate"></i>
    link: https://www.researchgate.net/profile/Nadir-Fasola
  - name: Facebook
    icon: <i class="fa-brands fa-facebook"></i>
    link: https://www.facebook.com/nadir.fasola/
  - name: Instagram
    icon: <i class="fa-brands fa-instagram"></i>
    link: https://www.instagram.com/nadir_fasola/
  - name: 500px
    icon: <i class="fa-brands fa-500px"></i>
    link: https://500px.com/p/nadirfasola?view=photos

defaults:
  - scope:
      path: "assets/img/gallery/jpg/fullSize"
    values:
      fullSizeJpg: true
  - scope:
      path: "assets/img/gallery/jpg/thumbs"
    values:
      thumbJpg: true
  - scope:
      path: "assets/img/gallery/jpg/placeholders"
    values:
      placeholderJpg: true
  - scope:
      path: "assets/img/gallery/webp/fullSize"
    values:
      fullSizeWebp: true
  - scope:
      path: "assets/img/gallery/webp/thumbs"
    values:
      thumbWebp: true
  - scope:
      path: "assets/img/gallery/webp/placeholders"
    values:
      placeholderWebp: true
